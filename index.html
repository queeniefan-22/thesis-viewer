<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Casting the In-between</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
    }

    /* =========================
       DESKTOP
       ========================= */

    body {
      padding: 60px 30px;
    }

    #viewer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }

    .spread {
      width: min(1400px, 95vw);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 0;
    }

    .spread.cover {
      width: min(700px, 47.5vw);
    }

    .page {
      position: relative;
      width: 50%;
      flex-shrink: 0;
    }

    .cover .page {
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    .linkLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pdfLink {
      position: absolute;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      background: transparent;
      text-decoration: none;
    }


    /* =========================
       MOBILE BOOK VIEWER
       ========================= */

    @media (max-width: 700px) {

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f2f2f2;
      }

      body {
        padding: 0;
      }

      #viewer {
        width: 100vw;
        height: 100dvh;

        display: flex;
        flex-direction: row;
        align-items: center;

        gap: 0;

        overflow-x: auto;
        overflow-y: hidden;

        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;

        -webkit-overflow-scrolling: touch;

        scrollbar-width: none;
      }

      #viewer::-webkit-scrollbar {
        display: none;
      }

      /* On mobile, the desktop "spread"
         containers disappear from layout. */

      .spread,
      .spread.cover {
        display: contents;
      }

      .page,
      .cover .page {
        width: 100vw;
        height: 100dvh;

        flex: 0 0 100vw;

        display: flex;
        align-items: center;
        justify-content: center;

        padding:
          max(18px, env(safe-area-inset-top))
          18px
          max(18px, env(safe-area-inset-bottom));

        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      canvas {
        width: auto;
        height: auto;

        max-width: 100%;
        max-height: 100%;

        object-fit: contain;

        box-shadow: 0 3px 14px rgba(0,0,0,0.14);
      }

      .linkLayer {
        /*
        JS below resizes/repositions this layer so it sits
        directly over the rendered PDF page.
        */
      }
    }
  </style>
</head>


<body>

<div id="viewer"></div>


<script type="module">

  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

  const pdfURL = "thesis.pdf";
  const viewer = document.getElementById("viewer");

  const pdf = await pdfjsLib.getDocument(pdfURL).promise;

  const pageElements = new Map();


  /* -------------------------
     Detect mobile mode
     ------------------------- */

  function isMobile() {
    return window.matchMedia("(max-width: 700px)").matches;
  }


  /* -------------------------
     Navigate to PDF page
     ------------------------- */

  async function goToDestination(dest) {

    try {

      let explicitDest = dest;

      if (typeof dest === "string") {
        explicitDest = await pdf.getDestination(dest);
      }

      if (!explicitDest || !explicitDest[0]) return;

      const pageIndex =
        await pdf.getPageIndex(explicitDest[0]);

      const pageNumber = pageIndex + 1;

      const target =
        pageElements.get(pageNumber);

      if (!target) return;


      /* MOBILE:
         horizontally slide to page */

      if (isMobile()) {

        target.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
          inline: "start"
        });

      }

      /* DESKTOP:
         vertically scroll to page */

      else {

        target.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }

    }

    catch (error) {
      console.error(
        "Could not open PDF destination:",
        error
      );
    }
  }


  /* -------------------------
     Render one PDF page
     ------------------------- */

  async function renderPage(
    pageNumber,
    container
  ) {

    const page =
      await pdf.getPage(pageNumber);

    const viewport =
      page.getViewport({
        scale: 1.6
      });


    const pageWrapper =
      document.createElement("div");

    pageWrapper.className = "page";
    pageWrapper.dataset.pageNumber =
      pageNumber;

    container.appendChild(pageWrapper);

    pageElements.set(
      pageNumber,
      pageWrapper
    );


    /* Canvas */

    const canvas =
      document.createElement("canvas");

    const context =
      canvas.getContext("2d");

    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;

    pageWrapper.appendChild(canvas);


    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;


    /* -------------------------
       PDF hyperlink annotations
       ------------------------- */

    const annotations =
      await page.getAnnotations({
        intent: "display"
      });

    if (annotations.length > 0) {

      const linkLayer =
        document.createElement("div");

      linkLayer.className =
        "linkLayer";

      pageWrapper.appendChild(
        linkLayer
      );


      for (
        const annotation
        of annotations
      ) {

        if (
          annotation.subtype !==
          "Link"
        ) continue;


        const rect =
          viewport
            .convertToViewportRectangle(
              annotation.rect
            );

        const left =
          Math.min(
            rect[0],
            rect[2]
          );

        const top =
          Math.min(
            rect[1],
            rect[3]
          );

        const width =
          Math.abs(
            rect[0] -
            rect[2]
          );

        const height =
          Math.abs(
            rect[1] -
            rect[3]
          );


        const link =
          document.createElement("a");

        link.className =
          "pdfLink";

        link.style.left =
          (left /
            viewport.width *
            100) + "%";

        link.style.top =
          (top /
            viewport.height *
            100) + "%";

        link.style.width =
          (width /
            viewport.width *
            100) + "%";

        link.style.height =
          (height /
            viewport.height *
            100) + "%";


        /* Internal link */

        if (annotation.dest) {

          link.href = "#";

          link.addEventListener(
            "click",
            async (event) => {

              event.preventDefault();

              await goToDestination(
                annotation.dest
              );

            }
          );

        }


        /* External URL */

        else if (annotation.url) {

          link.href =
            annotation.url;

          link.target =
            "_blank";

          link.rel =
            "noopener noreferrer";

        }


        linkLayer.appendChild(
          link
        );
      }
    }
  }


  /* =========================
     BUILD DOCUMENT
     ========================= */


  /* COVER */

  const cover =
    document.createElement("div");

  cover.className =
    "spread cover";

  viewer.appendChild(cover);

  await renderPage(
    1,
    cover
  );


  /* REMAINING PAGES */

  for (
    let pageNumber = 2;
    pageNumber <= pdf.numPages;
    pageNumber += 2
  ) {

    const spread =
      document.createElement("div");

    spread.className =
      "spread";

    viewer.appendChild(spread);


    await renderPage(
      pageNumber,
      spread
    );


    if (
      pageNumber + 1 <=
      pdf.numPages
    ) {

      await renderPage(
        pageNumber + 1,
        spread
      );

    }
  }


  /* =========================
     MOBILE LINK-LAYER ALIGNMENT
     ========================= */

  function alignMobileLinkLayers() {

    if (!isMobile()) return;

    document
      .querySelectorAll(".page")
      .forEach(pageWrapper => {

        const canvas =
          pageWrapper
            .querySelector("canvas");

        const layer =
          pageWrapper
            .querySelector(
              ".linkLayer"
            );

        if (!canvas || !layer)
          return;


        const pageRect =
          pageWrapper
            .getBoundingClientRect();

        const canvasRect =
          canvas
            .getBoundingClientRect();


        layer.style.left =
          (canvasRect.left -
           pageRect.left) + "px";

        layer.style.top =
          (canvasRect.top -
           pageRect.top) + "px";

        layer.style.width =
          canvasRect.width + "px";

        layer.style.height =
          canvasRect.height + "px";

        layer.style.right =
          "auto";

        layer.style.bottom =
          "auto";

      });
  }


  alignMobileLinkLayers();

  window.addEventListener(
    "resize",
    alignMobileLinkLayers
  );

</script>

</body>
</html>
