<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thesis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
      scroll-behavior: smooth;
    }

    body {
      padding: 60px 30px;
    }

    #viewer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }

    .spread {
      width: min(1400px, 95vw);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 0;
    }

    .spread.cover {
      width: min(700px, 47.5vw);
    }

    .page {
      position: relative;
      width: 50%;
    }

    .cover .page {
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    /* Clickable PDF links sit invisibly over the rendered page */
    .linkLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pdfLink {
      position: absolute;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      background: transparent;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      body {
        padding: 25px 10px;
      }

      #viewer {
        gap: 25px;
      }

      .spread {
        width: 100%;
      }

      .spread.cover {
        width: 50%;
      }
    }
  </style>
</head>

<body>

<div id="viewer"></div>

<script type="module">

  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

  const pdfURL = "thesis.pdf";
  const viewer = document.getElementById("viewer");

  const pdf = await pdfjsLib.getDocument(pdfURL).promise;

  // Keeps track of where every PDF page appears on the webpage.
  const pageElements = new Map();

  async function goToDestination(dest) {
    try {
      let explicitDest = dest;

      // Named PDF destination
      if (typeof dest === "string") {
        explicitDest = await pdf.getDestination(dest);
      }

      if (!explicitDest || !explicitDest[0]) return;

      const pageIndex = await pdf.getPageIndex(explicitDest[0]);
      const pageNumber = pageIndex + 1;

      const target = pageElements.get(pageNumber);

      if (target) {
        target.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }

    } catch (error) {
      console.error("Could not open PDF destination:", error);
    }
  }

  async function renderPage(pageNumber, container) {

    const page = await pdf.getPage(pageNumber);

    const viewport = page.getViewport({ scale: 1.6 });

    const pageWrapper = document.createElement("div");
    pageWrapper.className = "page";
    pageWrapper.dataset.pageNumber = pageNumber;

    container.appendChild(pageWrapper);

    pageElements.set(pageNumber, pageWrapper);

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    pageWrapper.appendChild(canvas);

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    // Add the PDF's hyperlink annotations.
    const annotations = await page.getAnnotations({
      intent: "display"
    });

    if (annotations.length > 0) {

      const linkLayer = document.createElement("div");
      linkLayer.className = "linkLayer";

      pageWrapper.appendChild(linkLayer);

      for (const annotation of annotations) {

        if (annotation.subtype !== "Link") continue;

        const rect = viewport.convertToViewportRectangle(annotation.rect);

        const left = Math.min(rect[0], rect[2]);
        const top = Math.min(rect[1], rect[3]);
        const width = Math.abs(rect[0] - rect[2]);
        const height = Math.abs(rect[1] - rect[3]);

        const link = document.createElement("a");
        link.className = "pdfLink";

        link.style.left =
          (left / viewport.width * 100) + "%";

        link.style.top =
          (top / viewport.height * 100) + "%";

        link.style.width =
          (width / viewport.width * 100) + "%";

        link.style.height =
          (height / viewport.height * 100) + "%";

        // Internal PDF link
        if (annotation.dest) {

          link.href = "#";

          link.addEventListener("click", async (event) => {
            event.preventDefault();
            await goToDestination(annotation.dest);
          });

        }

        // External web link
        else if (annotation.url) {

          link.href = annotation.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

        }

        linkLayer.appendChild(link);
      }
    }
  }


  // PAGE 1 — COVER

  const cover = document.createElement("div");
  cover.className = "spread cover";

  viewer.appendChild(cover);

  await renderPage(1, cover);


  // PAGES 2–3, 4–5, ETC.

  for (
    let pageNumber = 2;
    pageNumber <= pdf.numPages;
    pageNumber += 2
  ) {

    const spread = document.createElement("div");
    spread.className = "spread";

    viewer.appendChild(spread);

    await renderPage(pageNumber, spread);

    if (pageNumber + 1 <= pdf.numPages) {
      await renderPage(pageNumber + 1, spread);
    }
  }

</script>

</body>
</html>
